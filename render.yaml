services:
  - type: web
    name: invoice-processing-app
    runtime: docker
    plan: free
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: invoice-postgres
          property: connectionString

databases:
  - name: invoice-postgres
    databaseName: invoice_db
    user: invoice_user
    plan: free

